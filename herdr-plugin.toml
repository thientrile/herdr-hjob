id = "thientrile.hjob"
name = "hjob"
version = "0.1.0"
min_herdr_version = "0.9.1"
description = "Run long commands in the background; herdr notifies you and wakes the agent pane with the exit code and log path."
platforms = ["linux", "macos"]

[[actions]]
id = "install-cli"
title = "hjob: put the hjob command on PATH (~/.local/bin)"
contexts = ["global"]
command = ["sh", "install-cli.sh"]
